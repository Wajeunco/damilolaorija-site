<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1738;--bg2:#2b2460;--card:#f5f2ff;--ink:#1b1738;--muted:#575078;--cta:#f4a83a;--glove:#46c2ff;--uv:#7dff6a;--bad:#ff5d73;--good:#2fbf71;--radius:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;font-size:18px;line-height:1.45;background:radial-gradient(900px 560px at 85% -8%,#4a3bb0 0%,transparent 60%),radial-gradient(700px 500px at -5% 105%,#1d5f86 0%,transparent 60%),linear-gradient(170deg,var(--bg),var(--bg2));background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Plus Jakarta Sans','Plus Jakarta Sans',sans-serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--cta);outline-offset:3px}
#app{max-width:1180px;margin:0 auto;padding:18px 16px 48px;position:relative;z-index:2}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.floaters span{position:absolute;font-size:34px;opacity:.1;animation:drift 16s ease-in-out infinite}
.floaters span:nth-child(1){left:6%;top:18%}.floaters span:nth-child(2){left:88%;top:12%;animation-delay:-4s}.floaters span:nth-child(3){left:12%;top:78%;animation-delay:-8s}.floaters span:nth-child(4){left:80%;top:70%;animation-delay:-11s}.floaters span:nth-child(5){left:48%;top:92%;animation-delay:-6s}
@keyframes drift{50%{transform:translate(18px,-26px) rotate(12deg)}}

.btn{display:inline-block;background:var(--cta);color:#1b1738;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:1.2rem;padding:13px 28px;border-radius:14px;box-shadow:0 6px 0 #b9761b;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9761b}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.btn.sm{font-size:.95rem;padding:8px 16px;box-shadow:0 4px 0 #b9761b}
.btn.ghost.sm{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* title */
.brandbar{display:flex;align-items:center;gap:10px;color:#cfd8ff;font-weight:800;font-size:.95rem;margin-bottom:6px}
.brandbar .dot{width:12px;height:12px;border-radius:50%;background:var(--glove);box-shadow:0 0 12px var(--glove)}
.title-screen{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:70vh}
.tcopy h1{font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.02;color:#d8f1ff;margin-bottom:14px}
.tcopy h1 em{font-style:normal;color:var(--uv);text-shadow:0 0 18px rgba(125,255,106,.5)}
.lead{font-size:1.2rem;color:#d6dcff;margin:0 0 22px;max-width:520px}
.thero svg{width:100%;height:auto;max-height:520px}
@media(max-width:820px){.title-screen{grid-template-columns:1fr;min-height:0}.thero{order:-1}.thero svg{max-height:300px}}

/* generic light card */
.lcard{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:22px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.lcard h2{font-size:1.55rem;margin-bottom:8px}
.lcard p{margin:0 0 12px}
.lcard ul{margin:0 0 14px;padding-left:22px}
.lcard li{margin-bottom:6px}
.panel{max-width:760px;margin:20px auto 0}
.panel h2{color:#d8f1ff;font-size:2rem;margin-bottom:10px}
.panel p{color:#d6dcff}

/* characters */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:20px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:20px;transition:transform .2s,background .2s;animation:rise .6s both}
.cbtn:nth-child(2){animation-delay:.08s}.cbtn:nth-child(3){animation-delay:.16s}.cbtn:nth-child(4){animation-delay:.24s}
.cbtn:hover{transform:translateY(-6px);background:rgba(255,255,255,.08)}
.cbtn svg{width:170px;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.cname{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5rem}
.crole{color:#cfd8ff;font-weight:800;font-size:.95rem;text-align:center}
.cstars{font-size:1.1rem;letter-spacing:2px;min-height:1.5em}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

/* hud */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.top .lab{color:#9db0ff;font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.top h2{font-size:clamp(1.15rem,3vw,1.6rem);color:#e7f4ff}
.meters{display:flex;flex-wrap:wrap;gap:8px}
.meter,.gstat{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:12px;font-weight:800;font-size:.95rem;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px var(--mc,#fff)}
.meter b{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15rem;min-width:1.2em;text-align:center}
.m-s{--mc:#b36bff}.m-t{--mc:#7fb4ff}.m-c{--mc:#ffc15a}
.gstat.ok{--mc:var(--glove);color:#d6f3ff}
.gstat.bad{--mc:var(--uv);color:#eaffe0;background:rgba(125,255,106,.15);animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:inset 0 0 0 2px var(--uv),0 0 16px rgba(125,255,106,.55)}}

/* stage */
.stage{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:start}
@media(max-width:860px){.stage{grid-template-columns:1fr}.scenewrap{order:-1}}
.scenewrap{border-radius:26px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);background:#111;position:sticky;top:12px}
@media(max-width:860px){.scenewrap{position:relative;top:0}}
.scenewrap svg{display:block;width:100%;height:auto}
.toolrow{display:flex;gap:8px;justify-content:flex-end;margin:-4px 0 10px}
.step-lab{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.85rem;margin-bottom:8px}
.sit{font-size:1.08rem}
.obtns{display:grid;gap:10px;margin-top:14px}
.obtn{display:flex;gap:12px;text-align:left;align-items:flex-start;background:#251f55;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:1rem;line-height:1.35;border-bottom:4px solid transparent;transition:transform .15s,border-color .15s,background .15s;animation:rise .45s both}
.obtn:nth-child(2){animation-delay:.07s}.obtn:nth-child(3){animation-delay:.14s}.obtn:nth-child(4){animation-delay:.21s}
.obtn:hover{transform:translateY(-2px);border-bottom-color:var(--cta);background:#30287a}
.obtn .L{flex:0 0 32px;height:32px;border-radius:9px;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.05rem}
.hint{color:var(--muted);font-size:.92rem;margin-top:12px}

/* feedback */
.yours{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;border-left:6px solid var(--ink);font-weight:700}
.yours small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:.78rem}
.gbanner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px;animation:rise .5s both}
.gbanner.ok{background:#d9f3ff;color:#0c5578}
.gbanner.bad{background:#2b3a2c;color:var(--uv);box-shadow:0 0 0 2px var(--uv),0 0 20px rgba(125,255,106,.45)}
.gbanner .gi{font-size:1.6rem}
.fb{display:grid;gap:8px;margin:10px 0 12px}
.fbrow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;font-size:.98rem}
.fbrow b{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.05rem}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pip{width:9px;height:9px;border-radius:50%;background:#d4cdee}
.pip.on{background:var(--pc,#b36bff)}
.why{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.trailrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tchip{background:#1d3a24;color:var(--uv);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.9rem;box-shadow:inset 0 0 0 1.5px var(--uv)}
.lesson{background:#fff3c9;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.lesson small{display:block;color:#7a5a00;text-transform:uppercase;letter-spacing:.04em;font-size:.78rem;font-weight:800}

/* uv */
.uvwrap{background:#0b0a1c;border-radius:26px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.5);position:relative;overflow:hidden}
.uvhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.uvhead h2{color:#d8f1ff;font-size:1.5rem}
.board{position:relative;height:340px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#1a1740,#0b0a1c 70%);overflow:hidden}
.board.on{box-shadow:inset 0 0 60px rgba(125,255,106,.12)}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.trl{fill:none;stroke:var(--uv);stroke-width:3px;stroke-linecap:round;opacity:0;filter:drop-shadow(0 0 4px var(--uv))}
.board.on .trl{animation:draw .6s forwards;animation-delay:var(--d)}
@keyframes draw{to{opacity:.9}}
.tok{position:absolute;transform:translate(-50%,-50%);width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:.5s;transition-delay:var(--d)}
.tok .ti{width:54px;height:54px;border-radius:16px;background:#262352;display:grid;place-items:center;font-size:1.7rem;transition:inherit;box-shadow:inset 0 0 0 2px #3a3680}
.tok .tl{font-size:.78rem;font-weight:800;color:#9aa0d4;line-height:1.15}
.board.on .tok.bad .ti{background:#17381d;box-shadow:inset 0 0 0 3px var(--uv),0 0 22px rgba(125,255,106,.75);animation:glowp 1.6s ease-in-out infinite;animation-delay:var(--d)}
.board.on .tok.bad .tl{color:var(--uv)}
.board.on .tok.ok .ti{box-shadow:inset 0 0 0 3px #4cc3ff;background:#162a4a}
.board.on .tok.ok .tl{color:#9fdcff}
.tok .gx{position:absolute;top:-8px;right:8px;font-size:1.2rem;opacity:0;transition:.4s;transition-delay:var(--d)}
.board.on .tok.bad .gx{opacity:1;animation:wob 1.6s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:inset 0 0 0 3px var(--uv),0 0 34px rgba(125,255,106,.95)}}
@keyframes wob{50%{transform:translateY(-4px) rotate(10deg)}}
.uvgate{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,6,20,.78);z-index:3;transition:opacity .6s;text-align:center;padding:20px}
.uvgate.off{opacity:0;pointer-events:none}
.uvgate p{color:#d6dcff;margin:0 0 14px}
.result{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.result{grid-template-columns:1fr}}
.verdict{text-align:center}
.vemoji{font-size:3.4rem;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.vstars{font-size:2rem;letter-spacing:4px;margin:2px 0 4px}
.vtag{display:inline-block;border-radius:999px;padding:3px 14px;font-weight:800;margin-bottom:8px;font-size:.95rem}
.vtag.good{background:#d4f6e3;color:#0d6b3a}.vtag.mid{background:#ffe9bd;color:#7a5200}.vtag.bad{background:#ffd3da;color:#9c1730}
.scorebars{display:grid;gap:8px;margin:12px 0}
.sbar{display:grid;grid-template-columns:80px 1fr 38px;gap:10px;align-items:center;font-weight:800;font-size:.95rem}
.track{height:12px;border-radius:99px;background:#ddd6f3;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--mc);transition:width 1.2s cubic-bezier(.2,.9,.2,1);width:0}
.rules{background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;align-self:start}
.rules h3{font-size:1.15rem;margin-bottom:8px}
.rules ol{margin:0;padding-left:22px}
.rules li{margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,24,.8);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);color:var(--ink);border-radius:22px;padding:22px;max-width:620px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox h2{font-size:1.6rem;margin-bottom:10px}
.mbox dt{font-weight:800;margin-top:10px}
.mbox dd{margin:2px 0 0;color:#3b3560}
.mbox ul{padding-left:20px}
.mbox li{margin-bottom:6px}
.mclose{margin-top:14px}

/* svg animation */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.012)}}
.gtint{opacity:0;transition:opacity .6s}
svg.dirty .gtint{opacity:.5}
.germs{opacity:0;transition:opacity .5s}
svg.dirty .germs{opacity:1}
.gm{fill:#7dff6a;stroke:#2fa02a;stroke-width:1;animation:gup 2s ease-in infinite}
@keyframes gup{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-18px);opacity:0}}
svg .m-bad,svg .sweat{display:none}
svg.dirty .m-bad{display:inline}
svg.dirty .m-ok{display:none}
svg.dirty .sweat{display:inline;animation:drip 1.4s ease-in infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.steam{animation:steam 3s ease-in-out infinite;opacity:0}
.steam.s2{animation-delay:1s}.steam.s3{animation-delay:2s}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-26px);opacity:0}}
.blinkr{animation:blinkr 1s steps(2) infinite}
@keyframes blinkr{50%{opacity:.25}}
.twk{animation:twk 2.6s ease-in-out infinite}
@keyframes twk{50%{opacity:.2}}
.fl{animation:float 3s ease-in-out infinite}
.spin60{transform-origin:240px 44px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sunr{animation:float 4s ease-in-out infinite}
.germ-eyes{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== Brand layer: Damilola Orija ===== */
:root{--bg:#0C0C0D;--bg2:#0C0C0D;--card:#f4f4f2;--ink:#0C0C0D;--muted:#5c5c62;--cta:#fff;--line:rgba(255,255,255,.16);--radius:20px}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(900px 520px at 100% -10%,#26262a 0%,transparent 60%),#0C0C0D;background-attachment:fixed;font-size:17px}
h1,h2,h3,.disp{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.02em}
.floaters{display:none}
.btn{background:#fff;color:#0C0C0D;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1rem;border-radius:999px;padding:13px 26px;box-shadow:none}
.btn:hover{transform:none;background:#e9e9ec}.btn:active{transform:scale(.98);box-shadow:none}
.btn.sm{font-size:.9rem;padding:9px 18px;box-shadow:none}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}.btn.ghost.sm{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.lcard .btn,.mbox .btn{background:#0C0C0D;color:#fff}.lcard .btn:hover,.mbox .btn:hover{background:#2a2a2e}
.lcard .btn.ghost{background:transparent;color:#0C0C0D;box-shadow:inset 0 0 0 1.5px #0C0C0D}.lcard .btn.ghost:hover{background:rgba(0,0,0,.06)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}.lcard button:focus-visible,.mbox button:focus-visible{outline-color:#0C0C0D}
.eyebrow{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:700;color:#b9b9c0}
/* masthead and hub */
.mast{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
.wm{font-weight:800;font-size:1.1rem;letter-spacing:-.01em}.by{color:#a9a9b0;font-size:.85rem;font-weight:500}
.hubhead{max-width:820px;margin-bottom:38px}
.hubhead h1{font-size:clamp(2.6rem,8vw,5.2rem);line-height:1;margin:10px 0 16px}
.hubhead .soft{color:#8d8d95}
.lead{font-size:1.12rem;color:#d4d4d9;max-width:620px;margin:0 0 22px;font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;background:#141416;border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;min-height:340px;transition:transform .2s,border-color .2s,background .2s;color:#fff;animation:rise .6s both}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}
button.tile:hover{transform:translateY(-4px);border-color:#fff;background:#1a1a1d}
.tile .num{font-size:clamp(3.4rem,8vw,4.8rem);font-weight:800;line-height:1;letter-spacing:-.04em;margin-bottom:8px}
.tile .tt{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.tile .tg{font-size:.9rem;color:#a9a9b0;font-weight:600}
.tile .tb{color:#d4d4d9;font-size:.98rem;line-height:1.45;margin-top:6px}
.tile .tf{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;width:100%}
.prog{font-size:.85rem;color:#b9b9c0;font-weight:600}
.circ{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);display:grid;place-items:center;transition:.2s}
button.tile:hover .circ{background:#fff;color:#0C0C0D}
.tile.soon{border-style:dashed;background:transparent;color:#8d8d95}.tile.soon .num{color:#3b3b40}
.crumb{margin-bottom:6px}.back{color:#d4d4d9;font-weight:600;padding:6px 0}.back:hover{color:#fff;text-decoration:underline}
.panel{max-width:760px;margin:16px auto 0}.panel h2{font-size:clamp(2rem,6vw,3rem);margin:6px 0 10px;color:#fff}.panel p{color:#d4d4d9}
.cbtn{background:#141416;border:1px solid var(--line);border-radius:22px}.cbtn:hover{background:#1a1a1d;border-color:#fff;transform:translateY(-4px)}
.cname{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}.crole{color:#b9b9c0}.cstars{color:#fff}
/* hud */
.top .lab{color:#b9b9c0;font-weight:700;letter-spacing:.12em}.top h2{color:#fff;font-weight:800}
.meter,.gstat{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px var(--mc,#fff);border-radius:999px;padding:5px 14px}
.meter b{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.m-s{--mc:#fff}.m-t{--mc:#c8c8cd}.m-c{--mc:#8d8d95}
.gstat.ok{--mc:#fff;color:#fff}
.gstat.bad{--mc:#7dff6a;color:#eaffe0;background:rgba(125,255,106,.12)}
/* stage */
.scenewrap{border-radius:24px;box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.5)}
.lcard{background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.lcard h2{font-weight:800;color:#0C0C0D}
.step-lab{background:#0C0C0D;color:#fff;border-radius:999px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;padding:4px 14px}
.obtn{background:#0C0C0D;color:#fff;border-radius:14px;border:1px solid #0C0C0D;border-bottom-width:1px;font-weight:600}
.obtn:hover{transform:translateY(-2px);background:#26262a;border-color:#0C0C0D}
.obtn .L{background:#fff;color:#0C0C0D;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.yours{border-left-color:#0C0C0D}

 hot:[{id:'dispenser',i:'🧤',l:'Glove station',x:18,y:26},{id:'sink',i:'🧼',l:'Handwash sink',x:50,y:26},{id:'handles',i:'🚪',l:'Door and fridge handles',x:82,y:26},{id:'bells',i:'🔔',l:'Call bells',x:18,y:56},{id:'trolley',i:'🛒',l:'Trolley handles',x:50,y:56},{id:'wipes',i:'🧴',l:'Cleaning products',x:82,y:56},{id:'training',i:'👥',l:'Staff habits',x:34,y:84},{id:'sickness',i:'🤒',l:'Sickness rules',x:66,y:84}],
 steps:[
  {title:'The glove box is on the worktop next to the raw meat board, and the sink is blocked.',sit:"During the walk-round Helen sees that the only handwash sink is piled with trays, and the glove box sits beside the raw meat chopping board.",
   lesson:"Gloves only work when the basics are in place: an accessible handwash sink and a clean place to store gloves.",
   opts:[
    O('best',"Move the glove dispenser to a clean spot away from raw food, clear the sink so it is always usable, and add both to a daily check.",3,2,1,0,[],"People need to wash before they glove. A clear sink and a clean glove station make the safe routine the easy one."),
    O('over',"Close the kitchen until a full refit is finished.",3,3,3,0,[],"The problem can be fixed in minutes. Closing the kitchen would stop meals and cost far more than the issue is worth."),
    O('short',"Leave things as they are, because staff know where things go.",0,0,0,3,['dispenser','sink'],"A blocked sink pushes people to rely on gloves alone, and a glove box next to raw meat can get contaminated before anyone uses it."),
    O('flawed',"Buy more glove boxes and put them in every room so staff always have gloves.",1,1,2,2,['sink','training'],"More gloves with no way to wash hands reinforces the false sense of security. People wear gloves instead of washing.")
   ]},
  {title:'Staff tell Helen they wear gloves all shift because it feels safer.',sit:"They are not doing anything on purpose. It simply feels safer to keep gloves on, and nobody has shown them how gloves get contaminated.",
   lesson:"Teach people how gloves become contaminated. Rules without reasons create a false sense of security.",
   opts:[
    O('best',"Run a short, practical huddle with a glow-gel or touch-trail demonstration, and agree a simple routine: wash, glove, do the task, bin the gloves, wash.",3,2,1,0,[],"Seeing germs spread on gloved hands changes habits far more than being told. A short, practical session fits into a normal shift."),
    O('over',"Send every member of staff on a full external course this week.",3,3,3,0,[],"Formal courses help, but this is a large cost and removes staff from the floor when a short session would do."),
    O('short',"Email everyone a reminder to read the policy.",1,0,0,3,['training'],"Most people will not read it, and the false sense of security stays. A reminder with no practice rarely changes habits."),
    O('flawed',"Tell staff that gloves must be worn at all times when near food.",1,1,1,2,['training','dispenser'],"A rule to wear gloves all the time without clear change points makes the false sense of security worse.")
   ]},
  {title:'The handles, keypads and call bells are only cleaned once a week.',sit:"Helen notices that the door handles, fridge handles, keypad, call bells and trolley handles are all on the weekly deep clean, and nowhere else.",
   lesson:"Clean high touch points often and properly, using a food-safe product and the right contact time.",
   opts:[
    O('best',"Create a touch-point cleaning schedule with a food-safe sanitiser, give it to named roles on each shift, and sign it off.",3,2,1,0,[],"Regular cleaning keeps the germ load on high touch points low. Named roles and a sign-off mean it actually happens."),
    O('over',"Replace every handle and call bell with a no-touch fitting this week.",3,3,3,0,[],"No-touch fittings help, but replacing everything this week is a very large cost when a schedule already makes a big difference."),
    O('short',"Keep the weekly deep clean, because it is enough.",0,0,0,3,['handles','bells','trolley'],"A weekly clean leaves handles dirty for six days. Gloves pick up germs from them within minutes."),
    O('flawed',"Spray disinfectant around the kitchen at the end of the shift and wipe it off straight away.",1,1,1,2,['handles','wipes'],"Disinfectant needs time on a clean surface to work. Spraying and wiping it off straight away does not kill germs and can smear them around.")
   ]},
  {title:'A cook says she had vomiting yesterday but feels fine and wants to cook lunch.',sit:"She has told Helen honestly and says she will wear gloves and wash her hands a lot. Lunch is in three hours and the kitchen is short staffed.",
   lesson:"Staff with sickness or diarrhoea stay away from food until 48 hours after their last symptoms. Gloves do not change that.",
   opts:[
    O('best',"Thank her for telling you, keep her away from food handling until 48 hours after her last symptoms, and arrange cover.",3,2,2,0,[],"Someone who has been ill can still spread illness even if they feel better. Gloves and handwashing do not make up for this."),
    O('over',"Send the whole kitchen team home for a week.",3,3,3,0,[],"Only the person who has been ill needs to stay away. Sending everyone home puts residents' meals at risk."),
    O('short',"Let her work if she wears gloves and washes her hands often.",0,0,0,3,['sickness','training'],"Gloves do not stop an infectious person spreading illness. This is exactly how outbreaks start."),
    O('flawed',"Let her prepare cold desserts only, because they do not need cooking.",1,1,1,2,['sickness'],"Cold and ready-to-eat foods are the riskiest, because nothing kills germs afterwards. She should stay away from all food handling.")
   ]}
 ],
 end:{clean:"Staff understand that gloves are only one layer of protection. Touch points are cleaned regularly, sick staff stay away from food, and the next audit is clean.",
      near:"Some improvements are made, but gaps remain. The next audit finds the same habits, and Helen has to follow up with a tougher plan.",
      out:"Illness spreads through the unit. The service has to start its outbreak procedure, notify the right agencies, and explain what happened to families and inspectors."}}
];

var SAFE_TXT=['Leaves a clear route for germs to spread.','Lowers the risk a little, but gaps remain.','Lowers the risk well, with one small gap.','Breaks the route germs would have taken.'];
var TIME_TXT=['Takes almost no extra time.','Adds under a minute.','Adds a couple of minutes.','Takes a big chunk of the shift.'];
var COST_TXT=['Costs nothing extra.','Uses a little stock, such as gloves or wipes.','Uses a noticeable amount of stock or staff time.','Wastes food, stock or staff hours.'];

var GLOSS=[
 ['Cross-contamination','When germs move from one place to another, for example from raw chicken to a salad.'],
 ['Ready-to-eat food','Food that will be eaten without further cooking, such as salad, sandwiches, desserts and cooked meats.'],
 ['High touch point','A surface that many people touch, such as a door handle, fridge handle, keypad, call bell, trolley handle or phone.'],
 ['Hand hygiene','Washing hands thoroughly with soap and water and drying them well, including after taking gloves off.'],
 ['Single-use gloves','Disposable gloves used for one task and then thrown away. They are not a replacement for washing hands.'],
 ['Personal care','Tasks such as washing, dressing and continence care. Gloves and aprons used for these must never be worn near food.'],
 ['Barrier','Something such as a clean paper towel placed between your hand and a surface so that you do not touch it directly.'],
 ['Contact time','How long a cleaning or disinfectant product must stay wet on a clean surface before it works properly.'],
 ['Norovirus','A very infectious stomach bug that causes vomiting and diarrhoea. Alcohol gel does not reliably kill it, so wash with soap and water.'],
 ['Outbreak','Two or more people linked by the same illness in a service. It triggers an outbreak procedure and reporting.']
];

var RULES=['Wash your hands with soap and water before you put gloves on.','Use fresh gloves for each task, and bin them when the task is finished.','Change gloves after touching raw food, bins, phones, handles, your face or your hair.','Treat high touch points as dirty: handles, keypads, call bells, trolleys, pens and phones.','Wash your hands again after you take your gloves off.'];

 skin:'#8a5a3a',skinDk:'#794b2d',hair:'short',hairC:'#15110f',top:'#2f5d50',outfit:'night',sleeve:'long',bare:true,
 sub:'Mei is on the 8am medicines round.',
 intro:["It is 8am. Mei is the senior carer on shift and has 12 residents to give medicines to before breakfast finishes.","Medicines are one of the biggest sources of harm in care, and also one of the easiest places to take a shortcut when the day gets busy. Your job is to help Mei do the round safely without letting it take over the whole morning."],
 facts:["Every dose is recorded on the medication administration record (MAR) and the record is a legal document.","Residents with capacity are allowed to refuse their medicines.","Errors and near misses are reported so the home can learn from them, not to blame the person who found them."],
 gl:["Round is on track","Round is slipping"],bn:["This keeps the round safe and honest.","This leaves a gap in the round."],mk:"⚠️",hl:"Where the gap reached",
 uvTitle:"Where the risk spread",uvLead:"Green means the risk reached it. White means it stayed protected.",uvBtn:"💡 Show the ripple effect",gate:"Show where the risk from your choices spread.",
 hot:grid([["mar","📋","MAR chart"],["pots","💊","Tablet pots"],["tea","☕","His tea"],["trust","🤝","Resident trust"],["senior","📞","Senior and prescriber"],["stock","📦","Stock count"],["family","👪","Family"],["round","🦺","Rest of the round"],["record","🗂️","Audit trail"]]),
 steps:[
  {title:"Mr Singh says he will take his tablets later.",sit:"He has capacity to make decisions about his medicines. He looks at the pot, says \"Not now, I will take them later,\" and turns back to his tea.",
   lesson:"People with capacity can refuse medicines. Record the refusal honestly and tell the senior so the prescriber can be consulted if the medicine is time critical.",
   opts:[
    O("best","Respect his choice, record the refusal on the MAR using the correct code, offer again later in line with the timing guidance, and tell the senior on shift.",3,2,1,0,[],"He can refuse. You record it accurately, offer again when it is safe to do so, and escalate so the prescriber can advise if the medicine is time critical."),
    O("over","Stop the round and call the GP and his family straight away to report that he refused one dose.",3,3,3,0,[],"Telling the senior is right, but halting the whole round for one refused dose delays eleven other people. Follow the policy for refused doses."),
    O("short","Crush the tablets into his tea so he does not notice.",0,0,0,3,["tea","trust","mar"],"Hiding medicine in food or drink is covert administration. It is only allowed after a capacity assessment and a best interests decision involving the prescriber and pharmacist, never as a quick fix."),
    O("flawed","Sign the MAR as given and keep the tablets to offer him later.",1,0,0,2,["mar","pots","record"],"Signing before you have seen the medicine taken is a falsified record. The MAR now says something that did not happen.")
   ]},
  {title:"Someone interrupts Mei halfway through the round.",sit:"Mr Hussain's tablets are in the pot on the tray. A carer is asking Mei to look at a worried visitor and a call bell is ringing. The next three residents are waiting.",
   lesson:"Give one person's medicines at a time, watch them take them, and sign straight away. Do not leave medicines unattended or prepare them in advance.",
   opts:[
    O("best","Finish giving Mr Hussain his tablets, watch him swallow them, sign the MAR, then ask the carer to cover the bell and tell the visitor you will come over in a few minutes.",3,2,1,0,[],"You finish the task in front of you. Giving, seeing and signing in one go removes the chance of a missed or double dose, and others can cover the bell."),
    O("over","Lock the trolley, abandon the round and start again from the first resident once the interruptions have been dealt with.",3,3,3,0,[],"Safe, but starting over wastes time and risks doubled doses. You only need to finish the person you are with."),
    O("short","Leave the pot on his table so he can take them when ready, sign the MAR now to save time, and go to the call bell.",0,0,0,3,["pots","mar","record","trust"],"Medicines left unattended can be taken by someone else, dropped or missed. Signing before you see them swallowed is a false record."),
    O("flawed","Pop everyone's tablets into pots now so the round runs faster once the interruption is over.",1,0,0,2,["pots","mar","stock"],"Medicines should be prepared for one person just before they are given. Pre-prepared pots are how doses get mixed up.")
   ]},
  {title:"Mei spots a gap in last night's MAR.",sit:"Mrs Novak's 8pm tablet has no signature. Nobody wrote a refusal code either. It could have been missed, or given and not signed.",
   lesson:"If you find a possible error, do not guess and do not tidy it up. Tell your senior or manager now and record facts.",
   opts:[
    O("best","Check with the night staff who did the round, tell the manager straight away, follow the medicines error procedure, record the facts, and ask the pharmacist or GP what to monitor. Be open with Mrs Novak and her family.",3,2,1,0,[],"Telling the right people quickly lets someone seek clinical advice. Being honest with the person and family is part of the duty of candour."),
    O("over","Phone 999 and send Mrs Novak to hospital for observation even though she is well and the tablet is not time critical.",3,3,3,0,[],"Take clinical advice first. Calling an ambulance without it can cause harm and uses resources that someone else may need."),
    O("short","Sign the missing entry as given so the MAR looks complete.",0,0,0,3,["mar","record","trust","family"],"Signing something you did not see is falsifying a record. It also hides a possible error that the prescriber may need to know about."),
    O("flawed","Say nothing, but keep a close eye on Mrs Novak all day in case she seems unwell.",1,1,0,2,["senior","family","record"],"Watching quietly is not enough. A possible missed dose needs to be reported and clinical advice taken, not hidden.")
   ]},
  {title:"A daughter has brought in a herbal supplement.",sit:"Mrs Novak's daughter hands Mei a bottle and asks if her mum can have one every morning with her other medicines. It is natural, she says, so it cannot do any harm.",
   lesson:"Nothing is added to a person's medicines without a prescriber or pharmacist check. Natural products can interact with prescribed medicines.",
   opts:[
    O("best","Thank her for asking, explain that supplements can interact with prescribed medicines, do not give it, and ask the pharmacist or GP to review it. Record the conversation.",3,2,1,0,[],"Some herbal products change how prescribed medicines work. A professional check first keeps her safe, and you stay on good terms with her daughter."),
    O("over","Tell her that nothing may ever be brought into the home again and check all her visitors' bags.",3,3,3,0,[],"Families should feel able to ask. This protects nobody extra and damages trust."),
    O("short","Add it to the morning tablets, since it is natural and her daughter knows her best.",0,0,0,3,["pots","mar","family","stock"],"Giving an unprescribed product without a check can cause harm, and it is not on the MAR so nobody else knows about it."),
    O("flawed","Tell the daughter she can give it herself in the room whenever she visits.",1,0,0,2,["family","record","mar"],"This lets an unchecked product into a medicines routine with no record. It could affect how her prescribed tablets work.")
   ]}
 ],
 end:{clean:"The round finishes on time and every dose on the MAR matches what was actually given. Mei's handling of the gap means the pharmacist advises quickly, and Mrs Novak is fine.",
      near:"Nobody comes to harm, but the manager finds some entries on the MAR that do not match and carries out a medicines audit, which takes a lot of time.",
      out:"A medicines error reaches a resident and needs hospital advice. The home has to report it, review its procedures and explain what happened to the family."}}];

var SAFEGCH=[{id:'kemi',name:'Anna',role:'Care assistant',scene:'room',
 skin:'#6b4423',skinDk:'#5a371c',hair:'afro',hairC:'#15110f',top:'#7a3b6b',outfit:'night',sleeve:'short',bare:true,
 sub:"Anna is on a day shift and keeps noticing things that do not feel right.",
 intro:["Anna has worked at the home for six months. She is good with residents and they trust her, which means they sometimes tell her things they tell nobody else.","Today brings four moments where Anna has to decide whether to speak up, write it down, or let it go. Your job is to help her protect the people she supports, and the people she works with."],
 facts:["Safeguarding is everyone's job, whatever their role.","A concern does not have to be proven before it is reported.","What staff write down and share, including photos, affects dignity, privacy and trust."],
 gl:["Someone is protected","A concern is still open"],bn:["Someone is safer because of this.","Someone is more exposed because of this."],mk:"⚠️",hl:"Who was left exposed",
 uvTitle:"Where the risk spread",uvLead:"Green means the risk reached it. White means it stayed protected.",uvBtn:"💡 Show the ripple effect",gate:"Show where the risk from your choices spread.",
 hot:grid([["clarke","👵","Mrs Clarke"],["evidence","🗣️","What she said"],["staff","🧑‍⚕️","Staff member"],["team","👥","Wider team"],["manager","📞","Manager"],["notes","📝","Daily notes"],["photo","📸","Photos and phones"],["family","👪","Families"],["cqc","🏛️","CQC and local authority"]]),
 steps:[
  {title:"Mrs Clarke whispers a worry while Anna helps her dress.",sit:"She says one of the night staff handles her roughly when nobody is watching. Then she asks Anna not to tell anyone.",
   lesson:"Never promise to keep a safeguarding concern secret. Listen, record in their own words, and report straight away. Do not investigate yourself.",
   opts:[
    O("best","Listen calmly, tell her honestly that you must pass this on to keep her safe, write down what she said in her own words, and report it to the manager or safeguarding lead straight away.",3,2,1,0,[],"Staying calm, being honest, recording facts and reporting at once follows safeguarding procedure and gets protection in place quickly."),
    O("over","Announce it at the next handover so the whole team can keep watch.",3,3,2,0,[],"The right people need to know, but telling the whole team breaches confidentiality, may identify the person, and could spoil any investigation. Report to the manager or safeguarding lead."),
    O("short","Promise to keep it secret so she keeps trusting you.",0,0,0,3,["clarke","evidence","manager"],"You cannot promise secrecy when someone may be at risk. If you do, the concern is never reported and she stays exposed."),
    O("flawed","Speak to the night staff member first to hear their side.",1,1,0,2,["staff","evidence","clarke"],"Confronting the person could put Mrs Clarke at greater risk and spoil any investigation. It is not your role to investigate.")
   ]},
  {title:"Anna notices a bruise on Mr Reid's upper arm.",sit:"It is the size of a fifty pence piece and purple. Mr Reid says he bumped it, though he cannot say when. There is nothing in the notes about a fall or knock.",
   lesson:"Record what you see, ask open questions, and report it so a trained person can decide. Do not guess the cause.",
   opts:[
    O("best","Describe the bruise (where, size, colour) on a body map, record what he said in his words, and tell the senior or manager so they can decide whether to refer it.",3,2,1,0,[],"A factual record lets a trained person judge whether it needs a safeguarding referral, and shows if bruises are repeating."),
    O("over","Stop all his personal care and demand a doctor examines him before anything else happens today.",3,3,2,0,[],"A bruise needs recording and reporting, not halting his day. The senior decides on any medical review."),
    O("short","Assume he knocked it and leave it, since he says it was a bump.",0,0,0,3,["clarke","notes","manager"],"An unexplained bruise should always be recorded and reported. If it is a pattern, nobody will ever see it."),
    O("flawed","Write \"bruise probably from a fall\" in the notes.",1,0,0,2,["notes","evidence"],"Nobody saw a fall. Guessing the cause in the record can hide a safeguarding concern and mislead the next shift.")
   ]},
  {title:"A colleague posts a photo of Mrs Bailey in the staff WhatsApp group.",sit:"It is Mrs Bailey's birthday and she is wearing a party hat. The photo has been taken on a personal phone and posted with a caption that names her. Everyone has reacted with a heart.",
   lesson:"Photos of residents need consent, are taken on approved devices, and are never posted in staff chats or social media.",
   opts:[
    O("best","Message her privately, explain that the photo breaks confidentiality, ask her to remove it, and tell the manager so it can be handled under the home's policy.",3,2,1,0,[],"The photo shares a resident's image and name without consent. The manager needs to know because it may be a data breach."),
    O("over","Report your colleague to the police and tell the manager she should be dismissed.",3,3,2,0,[],"The photo was well meant. A private word and a report to the manager lets the home respond fairly and in proportion."),
    O("short","Add a heart to the post. It is lovely and she would not mind.",0,0,0,3,["photo","family","clarke"],"Mrs Bailey may be happy, but she has not given consent and the photo is now on a personal phone in a chat group. It cannot be taken back."),
    O("flawed","Ask your colleague to blur Mrs Bailey's face but leave the post up.",1,1,0,2,["photo","notes"],"The caption names her and the original is still on a personal phone. Blurring does not fix the consent problem.")
   ]},
  {title:"Anna realises her own note about Mrs Bailey was unfair.",sit:"Yesterday she wrote that Mrs Bailey was \"grumpy and attention seeking all morning.\" Reading it back, she can see that Mrs Bailey rang four times because she felt lonely.",
   lesson:"Records are factual and permanent. Correct a mistake by adding a dated, signed late entry. Never delete or overwrite the original.",
   opts:[
    O("best","Add a dated, signed late entry giving the facts (she rang four times between 9 and 10 and said she felt lonely), cross out the original with a single line, and tell the senior.",3,2,1,0,[],"The correction is transparent and the original is still legible. The next shift now has the right picture of how Mrs Bailey is."),
    O("over","Rewrite every note you have ever written about Mrs Bailey this month.",3,3,2,0,[],"One unfair note needs a correction, not a month of rewriting. Rewriting old notes can look like tampering."),
    O("short","Leave it. Nobody reads the old notes.",0,0,0,3,["notes","clarke","cqc"],"Mrs Bailey, her family or an inspector may read it. The next shift may treat her as a nuisance instead of recognising she is lonely."),
    O("flawed","Use correction fluid over the line and write a new version.",1,0,0,2,["notes","cqc"],"Deleting or covering entries is not allowed because it hides what was written. Always strike through with a single line and sign.")
   ]}
 ],
 end:{clean:"Mrs Clarke is safer, the bruise is recorded, the photo is taken down, and the notes tell the truth. Anna's six months of trust with residents is well placed.",
      near:"Nobody is harmed, but some of what Anna saw reached the right people late, and the manager runs a refresher on reporting and records.",
      out:"A concern was not reported in time. A resident has been left exposed, and the home now faces a safeguarding enquiry and questions from CQC and the local authority."}}];

var EMERGCH=[{id:'seun',name:'Daniel',role:'Team leader',scene:'corridor',
 skin:'#5b3a24',skinDk:'#4d2f1c',hair:'short',hairC:'#15110f',top:'#2b4f87',outfit:'night',sleeve:'long',bare:true,
 sub:"Daniel is the team leader on a day that keeps escalating.",
 intro:["Daniel is leading the shift with six staff. In the next few hours Daniel will deal with a resident who has fallen, someone choking at lunch, a stomach bug on one corridor and an upset family.","Every decision is about doing the right thing first, then the paperwork, then telling the right people. Your job is to help Daniel stay calm and keep everyone safe."],
 facts:["A team leader's first job in any emergency is to make people safe.","Falls, choking and outbreaks all have a procedure and the team needs a leader who follows it.","Families, CQC and public health need to hear the truth promptly."],
 gl:["Situation controlled","Situation slipping"],bn:["Daniel keeps things under control.","The situation is getting harder to control."],mk:"⚠️",hl:"What the risk reached",
 uvTitle:"Where the risk spread",uvLead:"Green means the risk reached it. White means it stayed protected.",uvBtn:"💡 Show the ripple effect",gate:"Show where the risk from your choices spread.",
 hot:grid([["resident","🧓","Mr Walsh"],["airway","🫁","Airway"],["ambulance","🚑","999 call"],["team","👥","Staff team"],["family","👪","Family"],["record","📝","Incident record"],["bug","🦠","Corridor 2"],["dining","🍽️","Dining room"],["cqc","🏛️","CQC and public health"]]),
 steps:[
  {title:"Mr Walsh is on the floor beside his bed.",sit:"He is awake and says his hip really hurts. Daniel is first on the scene. Two carers are further along the corridor.",
   lesson:"Keep them still, stay with them and get the right help first. Paperwork comes after.",
   opts:[
    O("best","Stay with him, keep him still, warm and reassured, call for help and follow the falls and emergency procedure, which may mean calling 999.",3,2,1,0,[],"Keeping him still and getting trained help quickly protects him from further injury, and someone stays with him the whole time."),
    O("over","Pull three staff off their rounds to stand with him and pause care for the whole unit until the ambulance arrives.",3,3,3,0,[],"One person stays with him and one calls for help. Stopping care for everyone else puts other residents at risk."),
    O("short","Help him back onto the bed so he is more comfortable.",0,0,0,3,["resident","record","family"],"Moving someone with a possible hip fracture or head injury can make it worse. He should not be moved until assessed."),
    O("flawed","Go to the office for the accident form so you do not forget any details.",1,1,0,2,["resident","record"],"Recording matters, but not before he is safe. Never leave a person who has fallen on their own.")
   ]},
  {title:"Mr Taylor starts coughing hard at lunch.",sit:"He is eating shepherd's pie when he begins to cough. His eyes are watering and his face is red, but he can still breathe and make a little noise. Daniel is two tables away.",
   lesson:"If a person can cough, encourage them to keep coughing. If the cough becomes silent or weak, or they cannot breathe, give 5 back blows, then 5 abdominal thrusts, and call 999.",
   opts:[
    O("best","Go to him, encourage him to keep coughing, stay beside him, and be ready. If the cough becomes weak or silent, or he cannot breathe, give 5 back blows, then 5 abdominal thrusts, and call 999.",3,2,1,0,[],"A strong cough is the best way to clear the airway, so you encourage it and watch closely. If it stops working you act straight away with back blows, abdominal thrusts and a 999 call."),
    O("over","Call 999 at once and ask other staff to stop the meal for everyone in the dining room while you stay with him.",3,3,3,0,[],"Calling for help is sensible if his cough fails, but stopping everyone else's meal is not needed. Stay with him and keep the rest of the room calm."),
    O("short","Give him a glass of water to wash it down.",0,0,0,3,["resident","airway","dining"],"A drink can push the food further down or make him choke on the liquid. Do not give anything to eat or drink while someone is choking."),
    O("flawed","Tip his head back and put your fingers in his mouth to sweep it out.",1,1,0,2,["resident","airway","ambulance"],"Sweeping blindly can push the food in deeper and bite you. Only remove an object you can see and reach, and let a strong cough do the work first.")
   ]},
  {title:"Two residents on Corridor 2 have vomiting and diarrhoea.",sit:"It started last night. Breakfast is about to begin and the team is stretched. Daniel needs to act before it spreads.",
   lesson:"Isolate, wash with soap and water, clean with the right product, and tell the manager and public health. Gel does not reliably kill norovirus.",
   opts:[
    O("best","Keep the unwell residents in their rooms, use gloves and aprons for care, wash hands with soap and water, stop shared activities for the corridor, clean with the right product, and tell the manager and local health protection team.",3,2,2,0,[],"Isolating cases, washing properly and cleaning with the right product limits spread. Reporting early gets support in place."),
    O("over","Close the whole home to everyone, cancel all meals and send every resident to hospital.",3,3,3,0,[],"Hospital transfer is not needed for everyone and could spread illness. Targeted control on one corridor is the safer response."),
    O("short","Carry on as normal and use hand gel between residents.",0,0,0,3,["bug","dining","team","cqc"],"Alcohol gel does not reliably kill norovirus and breakfast in the shared dining room spreads it. Isolation and soap and water are essential."),
    O("flawed","Clean the corridor with the usual spray and carry on, then review it after breakfast.",1,1,1,2,["bug","dining","cqc"],"Usual sprays are not enough for vomiting and diarrhoea. Waiting until after breakfast gives the illness hours to spread.")
   ]},
  {title:"Mr Walsh's daughter phones to ask what happened.",sit:"He has a fractured hip and is in hospital. Nobody has told her yet. She heard from the ambulance crew that he fell and she is upset and wants answers.",
   lesson:"Be open and honest with families promptly. Apologise, explain what you know, and say what happens next. Notify CQC when required.",
   opts:[
    O("best","Apologise, tell her what happened and what you know so far, explain what happens next, say you will update her, record the call, and make sure the manager considers whether CQC must be notified.",3,2,1,0,[],"Prompt, honest communication and an apology are part of the duty of candour. The manager decides on notifications."),
    O("over","Send a long written statement admitting full fault to every family in the home.",3,3,3,0,[],"One family needs to be told about one incident. Telling everyone is unnecessary, and statements of fault should come from the manager once facts are known."),
    O("short","Tell her you will ring back once you know more, and hope she does not call again.",0,0,0,3,["family","record","cqc"],"Waiting before telling a family is not acceptable. The duty to be open applies as soon as the harm is known."),
    O("flawed","Tell her he had a little slip and is fine.",1,0,0,2,["family","record"],"This is misleading. A fractured hip is serious and she deserves the facts.")
   ]}
 ],
 end:{clean:"Mr Walsh is treated quickly, Mr Taylor's cough clears his airway, the corridor illness stops at two cases, and his daughter knows what is happening. Daniel's calm kept the whole team steady.",
      near:"Nobody is seriously harmed, but some decisions were late. The manager holds a debrief and the team revisits the falls, fire and outbreak procedures.",
      out:"Delays and shortcuts cause real harm. The home has to report notifiable events, face questions from CQC and explain to families what went wrong."}}];

 sub:"Chidi is on a night shift with two colleagues and nineteen residents.",
 intro:["It is 2:10am. The home is quiet and most residents are asleep. Chidi is one of three staff on shift, and tonight the fire safety training from last year is about to be tested.","Fire safety in care is about people who cannot move quickly, long corridors and doors that need to stay closed. Your job is to help Chidi keep everyone safe while using the plan the home has already made."],
 facts:["Residents who are asleep, frail or in wheelchairs cannot always get themselves out.","Fire doors hold back smoke and flames for a set time, but only if they are shut.","Every resident should have a personal emergency evacuation plan (PEEP)."],
 gl:["Fire under control","Fire risk building"],bn:["This keeps people safe from fire.","This puts people at greater risk from fire."],mk:"🔥",hl:"Where the fire risk reached",
 uvTitle:"Where the risk spread",uvLead:"Green means the risk reached it. White means it stayed protected.",uvBtn:"💡 Show the ripple effect",gate:"Show where the risk from your choices spread.",
 hot:grid([["resident","🧓","Residents"],["alarm","🚨","Alarm panel"],["doors","🚪","Fire doors"],["route","🛗","Escape route"],["fire","🔥","The fire"],["ext","🧯","Extinguisher"],["peep","📋","PEEP"],["service","🚒","Fire service"],["team","👥","Night team"]]),
 steps:[
  {title:"Chidi finds a small fire in a bin in the lounge.",sit:"A cigarette end has been thrown into a paper bin by a visitor. Flames are about the size of a football. Mr Hughes is asleep in an armchair three metres away.",
   lesson:"Raise the alarm first. Protect people, then call the fire service. Only tackle a fire if it is small, you are trained, and you have an exit behind you.",
   opts:[
    O("best","Raise the alarm at the nearest call point, help Mr Hughes out of the room, close the door behind you, and make sure the fire service is called. Only use an extinguisher if the fire is still small, you have a clear exit and you are trained.",3,2,1,0,[],"The alarm brings help and starts the plan. Moving people away and closing the door limits smoke. Fighting a fire is the last step and only if it is safe."),
    O("over","Evacuate every resident from the whole building to the car park straight away, including residents who are bedbound.",3,3,3,0,[],"One small fire in one room does not need a full evacuation. Moving frail and bedbound residents outside at 2am can cause harm. Follow the zone plan."),
    O("short","Throw the kettle of water on the bin and deal with it quietly so nobody is woken.",0,0,0,3,["fire","resident","alarm","service"],"Staying quiet delays the alarm and the fire service. Water on a fire in a bin can spread it and make steam, and Mr Hughes is still in the room."),
    O("flawed","Go to find the manager on call to ask what to do before you do anything else.",1,1,0,2,["fire","alarm","team"],"Time matters in a fire. Raise the alarm first. The on call manager can be phoned once people are safe.")
   ]},
  {title:"The fire alarm sounds and the panel shows Zone 2.",sit:"Zone 2 is the east wing. Several residents there need help to move. Last week the alarm went off because of burnt toast. Chidi is at the panel.",
   lesson:"Treat every alarm as real until you know otherwise. Check the panel, follow the evacuation plan and close doors.",
   opts:[
    O("best","Check the panel for the zone, follow the evacuation plan for that area, close the doors, make sure the fire service has been called as the procedure says, and do a roll call so everyone is accounted for.",3,2,1,0,[],"A zone check and plan keep people safe without moving more people than needed. Closed doors slow fire and smoke, and a roll call shows who is out."),
    O("over","Wake and evacuate every resident from the whole building to the car park at once.",3,3,3,0,[],"Moving everyone is not safe or needed when the alarm is in one zone. Many homes use horizontal evacuation first, moving people to the next fire compartment on the same floor."),
    O("short","Assume it is the toast again and reset the panel.",0,0,0,3,["alarm","doors","resident","service"],"Never assume a false alarm. Resetting the panel without checking can leave people in a real fire."),
    O("flawed","Open the doors in Zone 2 to check for yourself before deciding what to do.",1,1,0,2,["doors","resident","fire"],"Opening a fire door can let smoke and flames spread. Check the panel and the plan, and do not go into the zone alone.")
   ]},
  {title:"A fire door has been wedged open with a chair.",sit:"A colleague has propped Mrs Fraser's bedroom door open so she can hear people in the corridor. She finds it comforting and asks that it stays that way.",
   lesson:"Fire doors only work when closed. Use an approved hold-open device linked to the alarm, never a wedge or a chair.",
   opts:[
    O("best","Remove the wedge, explain kindly why, ask the manager about an approved door holder that closes when the alarm sounds, and note it on the fire door check log.",3,2,1,0,[],"A wedged door will not hold back smoke. An approved hold-open device lets Mrs Fraser keep her door open and still closes when the alarm sounds."),
    O("over","Remove every wedge in the home, take the doors off their hinges to be assessed, and report your colleague for misconduct.",3,3,3,0,[],"The fire risk is real, but taking doors off or jumping straight to discipline is not proportionate. Fix the problem and tell the manager."),
    O("short","Leave it. She finds it comforting and it is only one door.",0,0,0,3,["doors","route","resident","fire"],"If a fire starts, an open door lets smoke into the corridor, which is the escape route for everyone."),
    O("flawed","Swap the chair for a heavier door stop so it does not move.",1,0,0,2,["doors","route"],"A heavier wedge is still a wedge. The door will not shut in a fire.")
   ]},
  {title:"A new resident arrives in a wheelchair, and nobody has written his PEEP.",sit:"Mr Singh was admitted this afternoon and has a room at the end of the first floor corridor. His family say he has difficulty with stairs. The night team has not been told how to move him.",
   lesson:"Every resident needs a personal emergency evacuation plan on admission, shared with everyone on shift.",
   opts:[
    O("best","Write his PEEP now with the team (how he moves, who helps, which route and equipment), put it in the fire folder, add him to the evacuation list, and tell the manager so it is reviewed.",3,2,1,0,[],"A PEEP tells the team exactly how to help him in an emergency. Sharing it and adding him to the list means the night team can act fast."),
    O("over","Wake all residents tonight for an unplanned full evacuation drill to test the plan.",3,3,3,0,[],"Drills help, but a surprise night drill frightens residents and could harm them. Test the plan with a planned drill."),
    O("short","Leave it until his admission review next month.",0,0,0,3,["peep","resident","team","route"],"A fire does not wait for the review. If there is no plan, nobody knows how to move him."),
    O("flawed","Tell the day staff he is a wheelchair user and trust that everyone will cope.",1,1,0,2,["peep","team","route"],"Informal word of mouth is not a plan. Night staff might not know, and the details of who helps and which route to use are missing.")
   ]}
 ],
 end:{clean:"The small fire is out before it spreads, everyone is accounted for, and Mr Singh has a PEEP that the whole team can use. The next fire inspection is clean.",
      near:"Nobody is harmed, but a few things were late. The fire risk assessment is reviewed and the team has a refresher on its fire plan.",
      out:"A fire spreads further than it should. People are put at risk, the fire service investigates, and the home has to explain its fire plan and training."}}];

var DOCCH=[{id:'rosa',name:'Rosa',role:'Senior carer',scene:'office',
 skin:'#d9a77c',skinDk:'#c8946a',hair:'bun',hairC:'#2a1a14',top:'#1f7a6b',outfit:'night',sleeve:'long',bare:true,
 sub:"Rosa is finishing a shift and has four records to get right.",
 intro:["It is 6:30pm. Rosa has been on shift since 8am and has a handover at 7. She is good with residents, and she knows records matter, but tonight she is tired and everything needs writing up.","If it is not written down, it did not happen. But what you write, when you write it and where you keep it all matter too. Your job is to help Rosa get the documentation right without losing the evening."],
 facts:["Records are legal documents. They can be read by residents, families, inspectors and courts.","Good records are factual, timely, signed and stored securely.","Poor records are a common finding in CQC inspections."],
 gl:["Record is reliable","Record is at risk"],bn:["This keeps the record reliable.","This puts the record at risk."],mk:"⚠️",hl:"What the gap reached",
 uvTitle:"Where the risk spread",uvLead:"Green means the risk reached it. White means it stayed protected.",uvBtn:"💡 Show the ripple effect",gate:"Show where the risk from your choices spread.",
 hot:grid([["notes","📝","Care notes"],["chart","📊","Fluid chart"],["plan","📋","Care plan"],["login","🔑","Logins"],["handover","🗣️","Handover"],["next","👥","Next shift"],["resident","🧓","The resident"],["inspector","🏛️","CQC inspector"],["family","👪","Family"]]),
 steps:[
  {title:"Mr Taylor fell at 3pm, and Rosa is writing the incident report at 6:30.",sit:"He was found on the floor by his bed, was checked, and was not hurt. Rosa has been busy since and is writing the report now. A colleague says to write that it happened because the unit was short staffed.",
   lesson:"Record as soon as it is safe, stick to facts, and sign and time it. Do not guess causes or blame people.",
   opts:[
    O("best","Write the facts: what you saw, what he said, what was done, who was told and when. Add the time you are writing it, sign it, and do not include opinions about why.",3,2,1,0,[],"Facts that anyone can check, with a time and signature, make the report reliable. An honest late entry is acceptable. A guess is not."),
    O("over","Write a three page statement covering your views on staffing, management and everything that went wrong that week.",3,3,2,0,[],"Records are for what happened, not for arguments. Concerns about staffing go to the manager through the right channel."),
    O("short","Copy the wording from a colleague's report so your accounts match.",0,0,0,3,["notes","inspector","resident","family"],"Each person records what they saw and did. Copying makes it look like collusion and loses the detail only you know."),
    O("flawed","Write that the fall happened because of staff shortages.",1,0,0,2,["notes","inspector"],"Nobody knows yet why he fell. An opinion about the cause in the record can mislead the investigation and unfairly blame people.")
   ]},
  {title:"Mrs Fraser refused fluids all afternoon.",sit:"She drank very little after lunch. Rosa knows the evening team need to keep encouraging her. She is about to leave the unit for handover and has not yet written it on the fluid chart or in the notes.",
   lesson:"Record as you go, not just in handover. A spoken message is gone as soon as it is spoken.",
   opts:[
    O("best","Record it on the fluid chart and in the care notes now, then give the handover, pointing to the record so the next shift can see the amounts and times.",3,2,1,0,[],"The chart is the source of truth. A handover that points to the record stays accurate, and the next shift can act on facts."),
    O("over","Photocopy the whole file for every member of the next shift so nobody misses anything.",3,3,3,0,[],"One record in one place is the point. Copies waste paper, go out of date and create a confidentiality risk."),
    O("short","Just tell the next shift. They will remember.",0,0,0,3,["handover","chart","next","resident"],"Verbal messages get lost or changed. If nothing is written, there is nothing for the doctor, family or inspector to see."),
    O("flawed","Write it in your own notebook to hand over to the next shift.",1,0,0,2,["handover","chart","next"],"A personal notebook is not part of the record and is not secure. Information should be written in the official records.")
   ]},
  {title:"Mr Taylor's care plan still says he is independent when walking.",sit:"After his fall, he now needs a walking frame and someone nearby. The care plan and falls risk assessment have not been updated. A new bank worker will use them tonight.",
   lesson:"If someone's needs change, update the care plan and risk assessment now, date and sign it, and tell the team.",
   opts:[
    O("best","Update the care plan and falls risk assessment now with the date and your signature, tell the team and the manager, and note that it needs a formal review.",3,2,1,0,[],"The bank worker will rely on the plan. An up to date, dated and signed plan keeps Mr Taylor safe tonight."),
    O("over","Stop everything this week and rewrite every resident's care plan from scratch.",3,3,3,0,[],"Update the plan that has changed. A full rewrite of every plan takes staff away from care and risks introducing errors."),
    O("short","Leave it until the monthly review.",0,0,0,3,["plan","resident","next","inspector"],"Tonight's staff will follow an out of date plan. That is how people fall again."),
    O("flawed","Stick a note on the front of the file saying he now needs a frame.",1,0,0,2,["plan","next","inspector"],"A sticky note can fall off and is not part of the legal record. The plan itself must be changed.")
   ]},
  {title:"A colleague asks to use Rosa's login to finish her entries.",sit:"Her own password has locked and the system admin is unavailable until morning. She has three residents' notes still to write. She says it will take ten minutes and she will write her initials after each entry.",
   lesson:"Never share logins. Every entry must be traceable to the person who made it.",
   opts:[
    O("best","Say no kindly, tell her to ask the manager or IT to reset her password, and suggest she writes on paper, which she then enters under her own login.",3,2,1,0,[],"Shared logins break the audit trail. Her own login and notes keep the record accurate and traceable."),
    O("over","Report her to the ICO and suspend her access to all systems for a month.",3,3,2,0,[],"She asked a question and you said no. Raise it with the manager, but this reaction is far too strong."),
    O("short","Let her use it. It will save time.",0,0,0,3,["login","notes","inspector","resident"],"Entries will look as if Rosa wrote them. If there is ever a problem, nobody can say who did what."),
    O("flawed","Let her use it but ask her to add her initials to each entry.",1,0,0,2,["login","notes","inspector"],"Initials are not a safeguard. The system still logs the wrong person, and sharing passwords may break the home's data protection rules.")
   ]}
 ],
 end:{clean:"The handover is smooth, Mr Taylor's plan is up to date, and every entry can be traced to the right person. If an inspector reads the file tomorrow, it tells the true story.",
      near:"The records are mostly sound, but a few entries are late or unclear. The manager reviews them and sets up a short documentation refresher.",
      out:"Gaps and errors in the records cause a resident to miss care, and CQC finds the home's documentation poor. The home has to explain itself and put an action plan in place."}}];
