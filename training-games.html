force:[["It is 2am and you are on your own. A resident cannot sleep and has asked for a sandwich.","You have been busy since the start of the shift, and you head to the kitchenette."],"How do you get the sandwich ready?"],
phone:[["It is mid-afternoon and you are preparing sandwiches for tea. You are wearing gloves, and your phone rings in your pocket. It is the shift leader calling you."],"What do you do?"],
cash:[["It is 3pm and a birthday tea is under way in the dining room. Visitors are arriving and a food delivery has just come. You are wearing gloves for serving."],"How do you handle the next hour?"],
lunch:[["It is 12:25pm. You have just helped Mrs Fraser with personal care and are heading into the dining room to serve lunch.","A call bell is ringing and the hot trolley has just arrived."],"How do you get lunch served?"],
round:[["It is 8am. You are the senior carer on shift, with 12 residents to give medicines to before breakfast finishes."],"How do you run the round?"],
gaps:[["It is later that morning. You are checking medication records and meeting families on the unit."],"What do you do?"],
confide:[["You have worked at the home for six months and residents trust you. Today, two moments make you stop and think."],"What do you do?"],
notes:[["It is the afternoon. There is a birthday in the lounge, and you have notes to finish before the end of your shift."],"What do you do?"],
fall:[["You are leading the shift with six staff. First a resident falls, and later his daughter rings."],"What do you do first?"],
lunchtime:[["Lunch is in full swing. One resident starts to cough while eating, and two others on Corridor 2 have a stomach bug."],"What do you do?"],
night:[["It is 2:10am. The home is quiet and most residents are asleep. You are one of three staff on shift, with nineteen residents."],"What do you do?"],
doors:[["It is a quiet afternoon, and you are doing your fire safety checks on the unit."],"What do you do?"],
shift:[["It is 6:30pm. You have been on shift since 8am, there is a handover at 7, and you still have records to write."],"What do you do?"],
plans:[["The shift is over, but two more records need your attention before you leave."],"What do you do?"]};
MODS.forEach(function(m){m.chars.forEach(function(c){var x=INTRO[c.id];c.intro=x[0];c.ask=x[1];c.facts=[]})});
/* ================= STATE ================= */
var S={screen:'hub',mi:0,ci:0,step:0,order:[],pick:null,m:{s:0,t:0,c:0,risk:0},glove:'clean',trail:[],res:null,done:{},modal:null};
var mod=function(){return MODS[S.mi]};
var ch=function(){return mod().chars[S.ci]};
var cur=function(){return ch().steps[S.step]};
var dkey=function(m,c){return m.id+'/'+c.id};

/* ================= CONFETTI ================= */
var cvs=$('#confetti'),cx=cvs.getContext('2d'),parts=[],raf=null;
function size(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',size);size();
function confetti(n,p){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#ffffff','#d9d9de','#9a9aa0','#7dff6a'];
  for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.35,vx:(Math.random()-.5)*14*p,vy:-Math.random()*13*p-4,r:4+Math.random()*6,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,l:0});
  if(!raf)raf=requestAnimationFrame(stepC);
}
function stepC(){
  cx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(function(q){return q.y<cvs.height+30&&q.l<260});
  parts.forEach(function(q){q.l++;q.vy+=.3;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.rot+=q.vr;cx.save();cx.translate(q.x,q.y);cx.rotate(q.rot);cx.fillStyle=q.c;cx.fillRect(-q.r,-q.r/2,q.r*2,q.r);cx.restore()});
  if(parts.length)raf=requestAnimationFrame(stepC);else{raf=null;cx.clearRect(0,0,cvs.width,cvs.height)}
}

/* ================= SCREENS ================= */
function pips(n,col){var o='';for(var i=0;i<3;i++)o+='<span class="pip'+(i<n?' on':'')+'" style="--pc:'+col+'"></span>';return '<span class="pips" aria-hidden="true">'+o+'</span>'}
function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n)}
function modStars(m){var t=0,got=0;m.chars.forEach(function(c){var d=S.done[dkey(m,c)];if(d!==undefined){t++;got+=d}});return {played:t,total:m.chars.length,got:got}}
function arrow(){return '<span class="circ" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>'}

function hud(){
  var c=ch(),d=S.glove==='dirty',m=S.m;
  return '<div class="meters" aria-label="Scores"><div class="meter m-s">🛡️ Safety <b>'+m.s+'</b></div><div class="meter m-t">⏱️ Pace <b>'+m.t+'</b></div><div class="meter m-c">🧰 Resources <b>'+m.c+'</b></div><div class="gstat '+(d?'bad':'ok')+'"><span>'+(d?c.mk:'✓')+'</span>'+c.gl[d?1:0]+'</div></div>';
}
function topbar(){
  var c=ch(),M=mod();
  return '<div class="top"><div><div class="lab">'+esc(M.title)+' &nbsp;·&nbsp; Scenario '+(S.ci+1)+' of '+M.chars.length+'</div><h2>'+esc(c.sub)+'</h2></div>'+hud()+'</div>';
}
function tools(){
  var M=mod();
  return '<div class="toolrow"><button class="btn ghost sm" data-a="sit">The situation</button><button class="btn ghost sm" data-a="gloss">Glossary</button>'+'<button class="btn ghost sm" data-a="chars">Choose scenario</button>'+'<button class="btn ghost sm" data-a="hub">All modules</button></div>';
}

function rHub(){
  var tiles=MODS.map(function(M,i){
    var st=modStars(M),prog='<span class="prog">'+(st.played?st.played+' of '+st.total+' played &nbsp;'+'★'.repeat(st.got):st.total+' scenarios · '+M.mins)+'</span>';
    return '<button class="tile" data-a="pick-mod" data-i="'+i+'" aria-label="Open '+esc(M.title)+'"><span class="num">'+M.num+'</span><span class="eyebrow">'+esc(M.track)+'</span><span class="tt">'+esc(M.title)+'</span><span class="tg">'+esc(M.game)+'</span><span class="tb">'+esc(M.blurb)+'</span><span class="tf">'+prog+arrow()+'</span></button>';
  }).join('');
  app.innerHTML='<header class="mast"><span class="wm">Training Games</span><span class="by">By Damilola Orija</span></header>'+
   '<section class="hubhead"><span class="eyebrow">Health and social care practice</span><h1>Pick a module.<br><span class="soft">Make the call.</span></h1><p class="lead">You play a carer on shift, facing real situations one mini story at a time. Every choice has a cost, and the small everyday ones matter most. Play alone, or talk each decision through as a team.</p><div class="row"><button class="btn ghost" data-a="how">How to play</button></div></section>'+
   '<section class="tiles" aria-label="Modules">'+tiles+'<div class="tile soon" aria-hidden="true"><span class="num">07</span><span class="eyebrow">Coming next</span><span class="tt">More modules</span><span class="tb">New tracks will appear here as they are added.</span></div></section>';
}
function rChars(){
  var M=mod();
  var b=M.chars.map(function(c,i){var d=S.done[dkey(M,c)];return '<button class="scn" data-a="pick-ch" data-i="'+i+'" aria-label="Play scenario '+(i+1)+': '+esc(c.title)+'"><span class="sn">'+(i<9?'0':'')+(i+1)+'</span><span class="st">'+esc(c.title)+'</span><span class="sf"><span class="cstars" aria-label="'+(d!==undefined?d+' stars':'Not played yet')+'">'+(d!==undefined?stars(d):'Not played')+'</span>'+arrow()+'</span></button>'}).join('');
  app.innerHTML='<div class="crumb"><button class="back" data-a="hub">← All modules</button></div><div class="panel" style="max-width:none"><span class="eyebrow">Module '+M.num+' · '+esc(M.game)+'</span><h2>'+esc(M.title)+'</h2><p>'+esc(M.blurb)+'</p><div class="scns">'+b+'</div></div>';
}
function rIntro(){
  var c=ch();
  app.innerHTML=topbar()+tools()+'<div class="stage"><div class="lcard"><span class="step-lab">The situation</span><h2>'+esc(c.sub)+'</h2>'+c.intro.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'<p class="ask">'+esc(c.ask)+'</p><button class="btn" data-a="go-step">Start the first decision</button></div><div class="scenewrap">'+sceneSVG(c,false)+'</div></div>';
}
function rDecision(){
  var c=ch(),st=cur();
  if(!S.order.length)S.order=shuffle([0,1,2,3]);
  var o=S.order.map(function(oi,i){return '<button class="obtn" data-a="choose" data-i="'+oi+'"><span class="L">'+LET[i]+'</span><span>'+esc(st.opts[oi].t)+'</span></button>'}).join('');
  app.innerHTML=topbar()+tools()+'<div class="stage"><div class="lcard"><span class="step-lab">Decision '+(S.step+1)+' of '+c.steps.length+'</span><h2>'+esc(st.title)+'</h2><p class="sit">'+esc(st.sit)+'</p><div class="obtns" role="group" aria-label="Choose what to do">'+o+'</div><p class="hint">Playing with a team? Talk it through together before you choose.</p></div><div class="scenewrap">'+sceneSVG(c,S.glove==='dirty')+'</div></div>';
}
function rFeedback(){
  var c=ch(),st=cur(),op=st.opts[S.pick],d=op.glove==='dirty';
  var letter=LET[S.order.indexOf(S.pick)];
  var hits=op.hits.map(function(id){var h=c.hot.filter(function(x){return x.id===id})[0];return h?'<span class="tchip">'+h.i+' '+esc(h.l)+'</span>':''}).join('');
  var last=S.step===c.steps.length-1;
  var banner='<div class="gbanner '+(d?'bad':'ok')+'"><span class="gi">'+(d?c.mk:'✓')+'</span><span>'+esc(c.bn[d?1:0])+'</span></div>';
  app.innerHTML=topbar()+tools()+'<div class="stage"><div class="lcard"><span class="step-lab">Decision '+(S.step+1)+' of '+c.steps.length+'</span><div class="yours"><small>Your choice</small>'+letter+'. '+esc(op.t)+'</div>'+banner+
   '<div class="why"><b>What happened:</b> '+esc(op.why)+'</div>'+
   '<div class="fb"><div class="fbrow"><b>Safety '+op.s+pips(op.s,'#0C0C0D')+'</b><span>'+SAFE_TXT[op.s]+'</span></div><div class="fbrow"><b>Pace '+op.tm+pips(op.tm,'#0C0C0D')+'</b><span>'+TIME_TXT[op.tm]+'</span></div><div class="fbrow"><b>Resources '+op.c+pips(op.c,'#0C0C0D')+'</b><span>'+COST_TXT[op.c]+'</span></div></div>'+
   (hits?'<div><small class="smlab">'+esc(c.hl)+'</small></div><div class="trailrow">'+hits+'</div>':'')+
   '<div class="lesson"><small>Remember this</small>'+esc(st.lesson)+'</div><button class="btn" data-a="next">'+(last?esc(c.uvBtn.replace(/^\S+\s/,'')):'Continue')+'</button></div><div class="scenewrap">'+sceneSVG(c,d)+'</div></div>';
}
function finish(){
  var m=S.m,R=m.risk,n=ch().steps.length,oT=n>=3?5:4,e=R<=1?'clean':(R<oT?'near':'out');
  var pt=e==='clean'?0:(e==='near'?2:5),pc=e==='clean'?0:(e==='near'?1:5);
  var t=m.t+pt,c=m.c+pc;
  var st=e==='clean'?((t<=Math.floor(2.5*n)&&c<=Math.floor(1.5*n))?3:2):(e==='near'?1:0);
  S.res={e:e,pt:pt,pc:pc,t:t,c:c,st:st};
  var k=dkey(mod(),ch());
  if(S.done[k]===undefined||st>S.done[k])S.done[k]=st;
}
function rResult(){
  var c=ch(),M=mod(),r=S.res,hit={},order=[];
  S.trail.forEach(function(id){if(!hit[id]){hit[id]=1;order.push(id)}});
  var byId={};c.hot.forEach(function(h){byId[h.id]=h});
  var toks=c.hot.map(function(h){var b=hit[h.id];var dly=b?(order.indexOf(h.id)*0.5+0.4):0.2;return '<div class="tok '+(b?'bad':'ok')+'" style="left:'+h.x+'%;top:'+h.y+'%;--d:'+dly+'s"><span class="gx">'+c.mk+'</span><span class="ti">'+h.i+'</span><span class="tl">'+esc(h.l)+'</span></div>'}).join('');
  var lines='';
  for(var i=1;i<order.length;i++){var a=byId[order[i-1]],b=byId[order[i]];if(a&&b)lines+='<line class="trl" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="--d:'+(i*0.5+0.1)+'s"/>'}
  var tag=r.e==='clean'?(r.st===3?['good','Safe and balanced']:['good','Safe, but over the top']):(r.e==='near'?['mid','A near miss']:['bad',M.outTag]);
  var emoji=r.e==='clean'?'🎉':(r.e==='near'?'😬':'🚨');
  var extra=r.e==='clean'?'':'<p class="note">'+(r.e==='near'?'Follow-up work added 2 to your Pace score and 1 to your Resources score.':'Dealing with the fallout added 5 to your Pace score and 5 to your Resources score.')+'</p>';
  var bar=function(l,v,mx,col){return '<div class="sbar" style="--mc:'+col+'"><span>'+l+'</span><div class="track"><div class="fill" data-w="'+Math.min(100,v/mx*100)+'"></div></div><span>'+v+'</span></div>'};
  var nxt='<button class="btn sm" data-a="chars">Play another scenario</button>';
  app.innerHTML=topbar()+'<div class="uvwrap"><div class="uvhead"><h2>'+esc(c.uvTitle)+'</h2><span class="uvlead">'+esc(c.uvLead)+'</span></div><div class="board" id="board">'+toks+'<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+lines+'</svg><div class="uvgate" id="gate"><div><p>'+esc(c.gate)+'</p><button class="btn" data-a="uv">'+esc(c.uvBtn)+'</button></div></div></div></div>'+
   '<div class="result" id="result" style="display:none"><div class="lcard verdict"><div class="vemoji" aria-hidden="true">'+emoji+'</div><div class="vstars" aria-label="'+r.st+' out of 3 stars">'+stars(r.st)+'</div><span class="vtag '+tag[0]+'">'+tag[1]+'</span><p>'+esc(c.end[r.e])+'</p><div class="scorebars">'+bar('Safety',S.m.s,3*ch().steps.length,'#0C0C0D')+bar('Pace',r.t,3*ch().steps.length+2,'#55555b')+bar('Resources',r.c,3*ch().steps.length+2,'#9a9aa0')+'</div>'+extra+(r.st<3?'<p class="note">'+(r.e==='clean'?'For three stars, stay safe without spending more than you need to.':'Replay to try for a clean ending.')+'</p>':'')+'<div class="row" style="justify-content:center"><button class="btn sm" data-a="replay">Play this scenario again</button>'+nxt+'<button class="btn ghost sm" data-a="hub">All modules</button></div></div>'+
   '<div class="rules"><h3>'+esc(M.rulesTitle)+'</h3><ol>'+M.rules.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol><p class="note" style="margin:10px 0 0">In short: '+esc(M.short)+'</p></div></div>';
}
function modal(){
  var h='';
  if(S.modal==='how')h='<h2>How to play</h2><ul><li>Pick a module, then a scenario. You always play the carer, and each scenario is a short story with its own traps.</li><li>Each scenario has a few decisions. Pick the option you think is best.</li><li>Every choice changes three scores. Safety is your protection. Pace and Resources show how much time and stock your choice uses up.</li><li>'+(S.screen==='hub'?'In some modules, a status chip shows whether things are under control.':esc(mod().howExtra))+'</li><li>At the end, a reveal shows where the risk spread, and you earn up to three stars.</li><li>Playing with a team on a shared screen? Talk through each choice before you pick.</li></ul>';
  if(S.modal==='gloss')h='<h2>Glossary</h2><dl>'+mod().gloss.map(function(g){return '<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'}).join('')+'</dl>';
  if(S.modal==='sit'){var c=ch();h='<h2>'+esc(c.sub)+'</h2>'+c.intro.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'<p class="ask">'+esc(c.ask)+'</p>'}
  var old=$('.modal');if(old)old.remove();
  if(!h)return;
  var d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="mbox">'+h+'<button class="btn sm mclose" data-a="close">Close</button></div>';
  document.body.appendChild(d);
  var b=$('.mclose',d);if(b)b.focus();
}
function render(){
  S.modal=null;modal();
  ({hub:rHub,chars:rChars,intro:rIntro,decision:rDecision,feedback:rFeedback,result:rResult})[S.screen]();
  scrollTo({top:0});
}
function go(s){S.screen=s;render()}
function startChar(i){
  S.ci=i;S.step=0;S.order=[];S.pick=null;S.m={s:0,t:0,c:0,risk:0};S.glove='clean';S.trail=[];S.res=null;
  go('intro');
}

/* ================= EVENTS ================= */
var A={
  hub:function(){go('hub')},
  how:function(){S.modal='how';modal()},
  gloss:function(){S.modal='gloss';modal()},
  sit:function(){S.modal='sit';modal()},
  close:function(){S.modal=null;modal()},
  chars:function(){go('chars')},
  'pick-mod':function(b){S.mi=+b.dataset.i;go('chars')},
  'pick-ch':function(b){startChar(+b.dataset.i)},
  'go-step':function(){S.order=[];go('decision')},
  choose:function(b){
    var i=+b.dataset.i,op=cur().opts[i];
    S.pick=i;S.m.s+=op.s;S.m.t+=op.tm;S.m.c+=op.c;S.m.risk+=op.risk;S.glove=op.glove;
    op.hits.forEach(function(id){S.trail.push(id)});
    go('feedback');
  },
  next:function(){
    var c=ch();
    if(S.step<c.steps.length-1){S.step++;S.order=[];S.pick=null;go('decision')}
    else{finish();go('result')}
  },
  uv:function(){
    $('#gate').classList.add('off');$('#board').classList.add('on');
    var n=Math.max(1,new Set(S.trail).size);
    setTimeout(function(){var r=$('#result');r.style.display='grid';r.scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(function(){document.querySelectorAll('.fill').forEach(function(f){f.style.width=f.dataset.w+'%'});if(S.res.st===3)confetti(140,1.3)},350)},900+n*500);
  },
  replay:function(){startChar(S.ci)}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var f=A[b.dataset.a];if(f)f(b);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;modal()}});

rHub();
})();
</script>
</body>
</html>
